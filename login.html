<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - Glow Beauty</title>

    <link rel="stylesheet" href="style.css">

</head>


<body class="login-page">


    <div class="login-box">

        <h1>
            Glow Beauty
        </h1>

        <h2>
            Login
        </h2>


        <form id="loginForm">

            <label>
                Username
            </label>

            <input
                id="username"
                type="text"
                placeholder="Enter your username"
            >


            <label>
                Password
            </label>

            <input
                id="password"
                type="password"
                placeholder="Enter your password"
            >


            <button type="submit">
                LOGIN
            </button>


            <p id="loginMessage"></p>

        </form>

    </div>



    <script>

        const loginForm =
            document.getElementById("loginForm");


        loginForm.addEventListener(
            "submit",
            function(event) {

                event.preventDefault();


                const username =
                    document.getElementById("username").value;


                const password =
                    document.getElementById("password").value;


                const message =
                    document.getElementById("loginMessage");


                if (
                    username === "" ||
                    password === ""
                ) {

                    message.innerHTML =
                        "Please enter username and password.";

                    return;

                }


                localStorage.setItem(
                    "userName",
                    username
                );


                message.innerHTML =
                    "Login successful!";


                setTimeout(
                    function() {

                        window.location.href =
                            "index.html";

                    },
                    700
                );

            }
        );

    </script>


</body>

</html>
