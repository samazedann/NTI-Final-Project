<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Glow Beauty</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>

        <div class="top">

            <div class="logo">
                💄 Glow Beauty
            </div>

            <div class="account">
                <a href="login.html">Login</a> /
                <a href="#">Register</a>
            </div>

        </div>


        <div class="middle">

            <div class="search-box">

                <input
                    id="searchInput"
                    type="text"
                    placeholder="Search for makeup products"
                >

                <button id="searchBtn">
                    🔍
                </button>

            </div>


            <div class="cart">

                🛒

                <span id="cartCount">
                    0
                </span>

            </div>

        </div>


        <nav>

            <button class="menu-btn" id="menuBtn">
                ☰
            </button>


            <ul id="navLinks">

                <li>
                    <button class="close-btn" id="closeBtn">
                        ✕
                    </button>
                </li>

                <li>
                    <a href="#">Home</a>
                </li>

                <li>
                    <a href="#products">Products</a>
                </li>

                <li>
                    <a href="#">About Us</a>
                </li>

                <li>
                    <a href="#">Contact</a>
                </li>

            </ul>

        </nav>

    </header>


    <main>

        <section class="welcome">

            <h1 id="welcomeText">
                Welcome to Glow Beauty
            </h1>

            <p>
                Simple makeup products for your everyday look ✨
            </p>

        </section>


        <section id="products">

            <h2>
                Makeup Products
            </h2>


            <div
                class="products-container"
                id="productsContainer"
            ></div>

        </section>

    </main>


    <script src="script.js"></script>

</body>

</html>
